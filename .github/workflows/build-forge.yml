name: Build Forge 1.20.1

on:
  push:
    branches: [ main, master ]
    paths:
      - 'forge-1.20.1/**'
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x forge-1.20.1/gradlew

      - name: Build with Gradle
        uses: gradle/actions/build-action@v2
        with:
          arguments: build --no-daemon -x test
          build-root-directory: forge-1.20.1
          cache-generated-files: true

      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: ordertocook-forge-1.20.1
          path: forge-1.20.1/build/libs/*.jar
          if-no-files-found: error
